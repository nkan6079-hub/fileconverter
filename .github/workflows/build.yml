name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache buildozer (SDK/NDK/packages)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-pip python3-venv \
            autoconf automake libtool libtool-bin pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev \
            zip unzip ccache
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Pre-download freetype & harfbuzz (savannah/freedesktop are down)
        run: |
          # p4a 的包缓存目录在 storage-dir/packages 下（与 buildozer 的 ~/.buildozer 无关）
          PKG_DIR="$GITHUB_WORKSPACE/.buildozer/android/platform/build-arm64-v8a/packages"
          mkdir -p "$PKG_DIR/freetype"
          curl -L --retry 8 --retry-delay 3 --retry-all-errors \
            -o "$PKG_DIR/freetype/freetype-2.14.1.tar.gz" \
            "https://downloads.sourceforge.net/project/freetype/freetype2/2.14.1/freetype-2.14.1.tar.gz"
          touch "$PKG_DIR/freetype/.mark-freetype-2.14.1.tar.gz"
          mkdir -p "$PKG_DIR/harfbuzz"
          curl -L --retry 8 --retry-delay 3 --retry-all-errors \
            -o "$PKG_DIR/harfbuzz/harfbuzz-2.6.4.tar.xz" \
            "https://github.com/harfbuzz/harfbuzz/releases/download/2.6.4/harfbuzz-2.6.4.tar.xz"
          touch "$PKG_DIR/harfbuzz/.mark-harfbuzz-2.6.4.tar.xz"
          ls -la "$PKG_DIR/freetype/" "$PKG_DIR/harfbuzz/"
          tar -tzf "$PKG_DIR/freetype/freetype-2.14.1.tar.gz" | head -1
          tar -tJf "$PKG_DIR/harfbuzz/harfbuzz-2.6.4.tar.xz" | head -1

      - name: Build APK
        env:
          PIP_DEFAULT_TIMEOUT: 60
          PIP_RETRIES: 10
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
