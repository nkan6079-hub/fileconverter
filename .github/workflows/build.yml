name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-pip python3-venv \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            zip unzip ccache
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Pre-download freetype & harfbuzz (savannah/freedesktop are down)
        run: |
          # freetype: savannah.gnu.org 持续 502, 用 sourceforge 镜像
          mkdir -p ~/.buildozer/android/packages/freetype
          curl -L --retry 8 --retry-delay 3 --retry-all-errors \
            -o ~/.buildozer/android/packages/freetype/freetype-2.14.1.tar.gz \
            "https://downloads.sourceforge.net/project/freetype/freetype2/2.14.1/freetype-2.14.1.tar.gz"
          touch ~/.buildozer/android/packages/freetype/.mark-freetype-2.14.1.tar.gz
          # harfbuzz: freedesktop.org 挂了, 用 GitHub Release 的官方 tar.xz
          mkdir -p ~/.buildozer/android/packages/harfbuzz
          curl -L --retry 8 --retry-delay 3 --retry-all-errors \
            -o ~/.buildozer/android/packages/harfbuzz/harfbuzz-2.6.4.tar.xz \
            "https://github.com/harfbuzz/harfbuzz/releases/download/2.6.4/harfbuzz-2.6.4.tar.xz"
          touch ~/.buildozer/android/packages/harfbuzz/.mark-harfbuzz-2.6.4.tar.xz
          ls -la ~/.buildozer/android/packages/freetype/ ~/.buildozer/android/packages/harfbuzz/
          tar -tzf ~/.buildozer/android/packages/freetype/freetype-2.14.1.tar.gz | head -1
          tar -tJf ~/.buildozer/android/packages/harfbuzz/harfbuzz-2.6.4.tar.xz | head -1

      - name: Build APK
        env:
          PIP_DEFAULT_TIMEOUT: 60
          PIP_RETRIES: 10
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
